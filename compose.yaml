services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: linear
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linear"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  app:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/linear?user=postgres&password=postgres
      SLATEDB_OBJECT_STORE_URL: memory:///
    volumes:
      - .:/workspace
      - clojure-m2:/root/.m2
      - clojure-gitlibs:/root/.gitlibs

volumes:
  clojure-gitlibs:
  clojure-m2:
  postgres-data:
