name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      COMPOSE_PROJECT_NAME: linear-ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build development image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: linear-ci-app
          cache-from: type=gha,scope=ci-app-linux-amd64
      - name: Start PostgreSQL
        run: docker compose up --detach --wait postgres
      - name: Restore npm downloads
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linear-npm-cache/_cacache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install JavaScript dependencies
        run: docker compose run --rm --volume "$RUNNER_TEMP/linear-npm-cache:/root/.npm" app npm ci --prefer-offline
      - name: Check secrets
        run: docker compose run --rm app npm run lint:secrets
      - name: Verify source policies, static checks, and application tests
        run: docker compose run --rm app bb verify
      - name: Test Turso SDK end to end
        run: docker compose run --rm app bb e2e
      - name: Measure coverage
        run: docker compose run --rm app bb coverage
      - name: Check CRAP scores
        run: docker compose run --rm app bb crap:check 30
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: target/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
      - name: Save coverage reports
        if: ${{ !cancelled() && hashFiles('target/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: cloverage
          path: target/coverage/
          retention-days: 14
          if-no-files-found: error
      # Publish caches only after all checks pass on main; PRs only restore them.
      - name: Save build cache from successful main builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: linear-ci-app
          cache-to: type=gha,scope=ci-app-linux-amd64,mode=max
      - name: Save npm downloads from successful main builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/linear-npm-cache/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
